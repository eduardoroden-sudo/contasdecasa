<title>Finanças da Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa com navegação por módulo + área de trabalho com cabeçalho de mês; vira abas horizontais no celular */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E8EDEB; --ink:#16201E; --muted:#5A6965; --line:#D3DCD9;
  --accent:#1D5C6E; --accent-ink:#FFFFFF; --accent-soft:#DCEAEE;
  --pos:#2A784A; --pos-soft:#E0EFE5; --neg:#AE3F2B; --neg-soft:#F5E1DC; --warn:#9C640F; --warn-soft:#F4E8D0;
  --font-d:'Sora',system-ui,sans-serif; --font-b:'IBM Plex Sans',system-ui,sans-serif; --font-m:'IBM Plex Mono',ui-monospace,monospace;
  --r:10px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --chart-ink:#3f4b48;
  --c-gan:#1baf7a; --c-gas:#eb6834; --c1:#2a78d6; --c2:#eda100; --c3:#e87ba4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#162020; --surface-2:#1E2928; --ink:#E4ECEA; --muted:#93A29E; --line:#2B3836;
  --accent:#6DB2C5; --accent-ink:#0B1A1E; --accent-soft:#1A3640;
  --pos:#6BBF8C; --pos-soft:#17301F; --neg:#E78872; --neg-soft:#3A1F19; --warn:#DDAE5F; --warn-soft:#342814; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --chart-ink:#c9d4d1; --c-gan:#199e70; --c-gas:#d95926; --c1:#3987e5; --c2:#c98500; --c3:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#162020; --surface-2:#1E2928; --ink:#E4ECEA; --muted:#93A29E; --line:#2B3836;
  --accent:#6DB2C5; --accent-ink:#0B1A1E; --accent-soft:#1A3640;
  --pos:#6BBF8C; --pos-soft:#17301F; --neg:#E78872; --neg-soft:#3A1F19; --warn:#DDAE5F; --warn-soft:#342814; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --chart-ink:#c9d4d1; --c-gan:#199e70; --c-gas:#d95926; --c1:#3987e5; --c2:#c98500; --c3:#d55181; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:14px}
.num,td.v,.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Login */
.login{max-width:440px;margin:6vh auto;display:grid;gap:20px}
.login .brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-d);font-weight:700}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:grid;gap:2px}
.who button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* App */
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;max-width:1320px;margin:0 auto}
.side{position:sticky;top:16px;align-self:start;display:grid;gap:18px}
.nav{display:grid;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav .cnt{font-size:11px;font-family:var(--font-m);background:var(--neg-soft);color:var(--neg);border-radius:20px;padding:0 7px}
.session{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
main{min-width:0;display:grid;gap:18px;align-content:start}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.monthsel{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.monthsel span{min-width:96px;text-align:center;font-weight:600;font-family:var(--font-d);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.icon{border:0;background:transparent;cursor:pointer;padding:4px 7px;border-radius:6px;color:var(--muted)}
.icon:hover{background:var(--surface-2);color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;display:grid;gap:4px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--font-m);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warnc{color:var(--warn)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.v,th.v{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap;width:1%}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.pos{background:var(--pos-soft);color:var(--pos)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.prev td{color:var(--muted)}

.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.ok{background:var(--pos)}.bar i.w{background:var(--warn)}.bar i.c{background:var(--neg)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.catrow .bar{grid-column:1/-1}
.list{display:grid;gap:12px}

.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;align-items:stretch}
.alert::before{content:"";border-radius:3px;background:var(--line)}
.alert.crit::before{background:var(--neg)}.alert.warn::before{background:var(--warn)}.alert.ok::before{background:var(--pos)}.alert.info::before{background:var(--accent)}
.alert b{display:block;font-weight:600}
.alert p{margin:2px 0 0;color:var(--muted);max-width:70ch}

.goal{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.goal .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--surface);border:1px solid var(--line)}
.ccard .face{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:14px;display:grid;gap:14px}
.ccard .face .num{font-size:20px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select,.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}

.chart svg{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line)}
.chart text{fill:var(--muted);font-family:var(--font-m);font-size:10px}
.chart .r{fill:var(--accent)}.chart .d{fill:var(--neg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.split{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.split span{display:grid;place-items:center;font-size:11px;font-family:var(--font-m);color:var(--accent-ink);white-space:nowrap;overflow:hidden}
.s1{background:var(--accent)}.s2{background:var(--warn)}.s3{background:var(--pos)}

.verdict{border-radius:var(--r);padding:14px;display:grid;gap:6px}
.verdict.ok{background:var(--pos-soft)}.verdict.warn{background:var(--warn-soft)}.verdict.crit{background:var(--neg-soft)}
.verdict h3{font-size:15px}

.overlay{position:fixed;inset:0;background:rgb(10 18 17 / .45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;display:grid;gap:16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:60;font-weight:500}
pre.sql{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--font-m);font-size:12px;line-height:1.55;margin:0;max-height:420px}
details summary{cursor:pointer;font-weight:600}
.demo{font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px}
.empty{color:var(--muted);padding:12px 0}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.navsep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.nav button.athos span:first-child{font-family:var(--font-d);letter-spacing:.06em}
.err{color:var(--neg);font-size:13px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin-top:4px}
@media (max-width:860px){.navsep{display:none}}
/* lançamento rápido */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;padding:13px 20px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgb(0 0 0 / .18)}
.fab:hover{filter:brightness(1.08)}
.form .seg{display:flex;width:100%}
.form .seg button{flex:1;padding:8px 10px}
.field.big input{font-size:22px;font-family:var(--font-m);padding:10px 12px}
.advtoggle{justify-self:start}
/* gráficos do painel */
.segbar{display:flex;gap:2px;height:30px}
.segbar span{display:block;height:100%;min-width:2px}
.segbar span:first-child{border-radius:4px 0 0 4px}.segbar span:last-child{border-radius:0 4px 4px 0}
.segbar span:only-child{border-radius:4px}
.lg{display:grid;gap:6px}
.lg-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center}
.lg-row i{width:12px;height:12px;border-radius:3px}
.lg-row .pc{color:var(--muted);font-family:var(--font-m);font-size:12px;min-width:38px;text-align:right}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center}
.hbar .tr{position:relative;height:14px}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--c-gas)}
.hbar .tr b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--chart-ink);border-radius:1px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart .ln{fill:none;stroke:var(--chart-ink);stroke-width:2}
.chart .mk{fill:var(--surface);stroke:var(--chart-ink);stroke-width:2}
.venc{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
/* painel */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec h2{font-size:20px}
.sec .muted{font-size:13px}
.res{display:grid;gap:14px}
.res-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.res-row .k{font-weight:600;display:flex;align-items:center;gap:8px}
.res-row .k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.res-row .val{font-family:var(--font-m);font-size:22px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.res-row .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.uso{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.uso i{display:block;height:100%;background:var(--c-gas);border-radius:5px}
.rot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.rot>div{padding:12px 14px;display:grid;gap:4px;border-right:1px solid var(--line);align-content:start;min-width:0}
.rot>div:last-child{border-right:0}
.rot .v2{font-family:var(--font-m);font-size:17px;font-variant-numeric:tabular-nums}
.rot .btn{justify-self:start;margin-top:4px}
.subh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.nav .navmais{color:var(--muted);font-size:13px}
.lfilt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.kpi{all:unset;box-sizing:border-box;padding:14px 16px;display:grid;gap:4px;border-right:1px solid var(--line);cursor:pointer}
button.kpi:last-child{border-right:0}
button.kpi:hover{background:var(--surface-2)}
button.kpi.on{background:var(--accent-soft)}
button.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.fxt tr.sel td{background:var(--accent-soft)}
table.fxt tbody tr:hover td{background:var(--surface-2)}
table.mat td,table.mat th{padding:6px 8px;font-size:12px;font-family:var(--font-m)}
table.mat td.nm{font-family:var(--font-b);font-size:13px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.lfilt select,.lfilt input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
@media (max-width:1060px){.rot{grid-template-columns:repeat(2,minmax(0,1fr))}.rot>div:nth-child(2){border-right:0}.rot>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:560px){.rot{grid-template-columns:minmax(0,1fr)}.rot>div{border-right:0;border-bottom:1px solid var(--line)}.res-row .val{font-size:19px}}
@media (max-width:1060px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;gap:10px}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .session{grid-template-columns:1fr auto;align-items:center}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:0;border-bottom:1px solid var(--line)}
  .form{grid-template-columns:minmax(0,1fr)}
  .who{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Ganhos e gastos (visão de caixa): resumo de 4 números, de onde veio / para onde foi, planilha do ano */
.gg-chips{display:flex;gap:6px;flex-wrap:wrap}
.gg-chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;color:var(--ink)}
.gg-chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gg-chips button.vz{color:var(--muted)}
.gg-big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gg-big>div{padding:16px 18px;display:grid;gap:2px;border-right:1px solid var(--line);align-content:start}.gg-big>div:last-child{border-right:0}
.gg-big .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.gg-big .n{font-family:var(--font-m);font-size:24px;font-variant-numeric:tabular-nums}
.gg-big .s{font-size:12px;color:var(--muted)}
.gg-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.gg-grp{display:grid;gap:6px;padding-top:6px}
.gg-grp+.gg-grp{border-top:1px solid var(--line);padding-top:12px}
.gg-grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gg-grp-h b{font-family:var(--font-d);font-size:15px}
.gg-it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;cursor:pointer;border-radius:8px;padding:6px 8px;margin:0 -8px}
.gg-it:hover{background:var(--surface-2)}
.gg-it .nm{display:flex;gap:6px;align-items:baseline;min-width:0}
.gg-it .nm span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gg-it .val{font-family:var(--font-m);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.gg-it .bar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.gg-it .bar i{display:block;height:100%;border-radius:4px}
.gg-it .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.gg-det{grid-column:1/-1;margin-top:6px;border-left:2px solid var(--line);padding-left:10px;font-size:13px;display:grid;gap:2px;max-height:300px;overflow:auto;cursor:default}
.gg-det .r{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px}
.gg-det .r span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gg-det .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-top:6px}
.gg-det .f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.gg-tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.gg-tbl table{border-collapse:collapse;width:100%;font-size:13px}

  const ini=ymOf(l.data);if(mm<ini||(l.ate&&mm>l.ate))return null;

function itensMes(m,tipo,escopo='todos'){

    const o=ocorrencia(l,m);if(o)out.push({...o,valorMes:+o.valor});

function cpHistorico(b,m){return S.lancamentos.filter(l=>l.conta_pagar_id===b.id&&l.competencia&&l.competencia<m).sort((a,c)=>c.competencia.localeCompare(a.competencia)).slice(0,3)}
function cpFora(b,m){const p=cpPago(b,m);if(!p)return null;const h=cpHistorico(b,m);if(h.length<2)return null;const med=h.reduce((s,l)=>s+ +l.valor,0)/h.length;if(!med)return null;const d=(p.valor-med)/med*100;return Math.abs(d)>=20?{d,med,p}:null}

function cpCompetencia(b,data,usados){

  return best&&best.c;
}
function cpValorRef(b){if(+b.valor_estimado>0)return +b.valor_estimado;const u=S.lancamentos.filter(l=>l.conta_pagar_id===b.id).sort((a,c)=>c.data.localeCompare(a.data))[0];return u?+u.valor:0}

}

function resumo(m,escopo='todos'){

const difMeses=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y2-y1)*12+(m2-m1)};
// Itens de uma fatura: usa o dia de fechamento do cartão
function itensFatura(cid,m){

function vencFatura(c,m){const vm=+c.vencimento>+c.fechamento?m:addM(m,1);return vm+'-'+pad(Math.min(+c.vencimento,diasNoMes(vm)))}
function comprometidoFuturo(m,n){let t=0;S.lancamentos.forEach(l=>{if(l.cartao_id&&!recorrente(l)&&+l.parcelas>1)parcelasDe(l).forEach(p=>{if(p.m>m&&p.m<=addM(m,n))t+=p.valor})});return t}
const acumMeta=id=>S.aportes.filter(a=>a.meta_id===id).reduce((s,a)=>s+ +a.valor,0);
function mediaMeses(m,n,f){let t=0;for(let i=1;i<=n;i++)t+=f(resumo(addM(m,-i)));return t/n}
/* ---------------- Saldo das contas e fluxo de caixa ---------------- */
const contasComSaldo=()=>S.contas.filter(c=>c.saldo_data);
const fimDoMes=m=>m+'-'+pad(diasNoMes(m));
// Movimentos de uma conta: lançamentos sem cartão nessa conta, contas a pagar ainda abertas e faturas dos cartões pagos por ela
function movConta(c,ini,fim){
  const out=[],h=hoje();
  for(let m=ymOf(ini);m<=ymOf(fim);m=addM(m,1)){
    ['receita','despesa'].forEach(t=>itensMes(m,t).forEach(x=>{
      if(x.cartao_id||x.conta_id!==c.id)return;
      let d=x.data;
      if(x.cp){if(d<h)d=h;if(d<=fim)out.push({data:d,desc:x.descricao+' (a pagar)',valor:-x.valorMes,cp:true,conta:c.id,escopo:x.escopo});return}
      if(d>ini&&d<=fim)out.push({data:d,desc:x.descricao,valor:(t==='receita'?1:-1)*x.valorMes,conta:c.id,escopo:x.escopo,rec:recorrente(x)});
    }));
  }
  S.cartoes.filter(k=>k.conta_pagamento_id===c.id).forEach(k=>{
    for(let m=addM(ymOf(ini),-1);m<=addM(ymOf(fim),1);m=addM(m,1)){
      const d=vencFatura(k,m);if(d<=ini||d>fim)continue;const v=faturaCartao(k.id,m);
      if(v>0)out.push({data:d,desc:`Fatura ${k.nome} (${mesNome(m)})`,valor:-v,fatura:true,conta:c.id});
    }
  });
  return out.sort((a,b)=>a.data.localeCompare(b.data)||b.valor-a.valor);
}
function saldoAtual(c){
  if(!c.saldo_data)return null;const h=hoje();
  if(c.saldo_data>=h)return +c.saldo_inicial;
  return +c.saldo_inicial+movConta(c,c.saldo_data,h).filter(x=>!x.cp).reduce((s,x)=>s+x.valor,0);
}
// Projeção de hoje até 'fim': saldo dia a dia, menor saldo e saldo final
function projecao(contas,fim){
  const h=hoje();let saldo=0;const itens=[];
  contas.forEach(c=>{saldo+=saldoAtual(c);movConta(c,c.saldo_data>h?c.saldo_data:h,fim).forEach(x=>{if(x.cp||x.data>h)itens.push(x)})});
  itens.sort((a,b)=>a.data.localeCompare(b.data)||b.valor-a.valor);
  const inicio=saldo;let min=saldo,minData=h;const dias=[];let i=0;
  for(let d=h;d<=fim;){
    while(i<itens.length&&itens[i].data===d){saldo+=itens[i].valor;itens[i].saldo=saldo;i++}
    dias.push({d,saldo});if(saldo<min){min=saldo;minData=d}
    const dt=new Date(d+'T12:00');dt.setDate(dt.getDate()+1);d=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
  }
  return{inicio,final:saldo,min,minData,itens,dias};
}
function fimProjecao(){return fimDoMes(mes>=curYM()?mes:curYM())}
function dispPorDia(m,r){
  if(m!==curYM())return null;const rest=diasNoMes(m)-(+hoje().slice(8,10))+1;
  const cs=contasComSaldo();
  if(cs.length){const p=projecao(cs,fimDoMes(m));return Math.max(0,p.min-S.config.saldo_minimo)/rest}
  return Math.max(0,r.saldo-S.config.saldo_minimo)/rest;
}

/* ---------------- Alertas e conselhos ---------------- */
function alertas(m){
  const r=resumo(m),C=S.config,A=[];
  if(m===curYM()&&!S.semImport){const dia=+hoje().slice(8,10);
    S.cartoes.forEach(k=>{if(dia>+k.fechamento&&!S.importacoes.some(i=>i.tipo==='fatura'&&i.cartao_id===k.id&&i.referencia===m))A.push({n:'warn',t:`Fatura ${k.nome} de ${mesNome(m)} fechou`,p:`Fechou no dia ${k.fechamento}. Baixe o CSV da fatura no app do banco e use Importar para conferir e lançar as compras.`})});
    if(dia<=10){const pm=addM(m,-1);S.contas.forEach(c=>{const usa=S.importacoes.some(i=>i.tipo==='extrato'&&i.conta_id===c.id);if(usa&&!S.importacoes.some(i=>i.tipo==='extrato'&&i.conta_id===c.id&&i.referencia===pm))A.push({n:'warn',t:`Importe o extrato de ${mesNome(pm)}: ${c.nome}`,p:'Assim as compras no débito e os Pix entram no sistema e o saldo da conta é atualizado.'})})}}
  if(m===curYM())contasComSaldo().forEach(c=>{const p=projecao([c],fimDoMes(m));
    if(p.min<0)A.push({n:'crit',t:`${c.nome} pode ficar negativa`,p:`Pela previsão, o saldo chega a ${brl(p.min)} em ${dataBR(p.minData)}. Veja em Saldo das contas o que sai antes do próximo crédito.`});
    else if(p.min<S.config.saldo_minimo)A.push({n:'warn',t:`${c.nome} fica abaixo do mínimo`,p:`O menor saldo previsto é ${brl(p.min)} em ${dataBR(p.minData)}, abaixo dos ${brl(S.config.saldo_minimo)} definidos.`})});
  if(m===curYM())[addM(m,-1),m].forEach(mm=>cpAtivas(mm).forEach(b=>{const f=cpFora(b,mm);if(f&&f.d>0)A.push({n:'warn',t:`${b.nome} veio ${pct(f.d)} acima da média`,p:`Pago ${brl(f.p.valor)} em ${mesNome(mm)}. A média dos meses anteriores é ${brl(f.med)}.`})}));
  if(m===curYM())cpPendencias().forEach(({b,m:mm,st})=>A.push(st.s==='atrasada'
    ?(extratoImportado(b.conta_id,mm)?{n:'crit',t:`${b.nome} de ${mesNome(mm)} não apareceu no extrato`,p:`Venceu em ${dataBR(cpVenc(b,mm))} e não foi encontrada no extrato importado. Se já pagou por outro meio, marque em Contas do mês.`}
      :{n:'crit',t:`${b.nome} está atrasada`,p:`Venceu em ${dataBR(cpVenc(b,mm))}${mm!==m?' (conta de '+mesNome(mm)+')':''}. ${cpValorRef(b)?'Valor de referência '+brl(cpValorRef(b))+'. ':''}Marque como paga em Contas do mês.`})
    :{n:'warn',t:`${b.nome} vence ${st.dias===0?'hoje':'em '+st.dias+' dia(s)'}`,p:`Vencimento em ${dataBR(cpVenc(b,mm))}${cpValorRef(b)?', valor de referência '+brl(cpValorRef(b)):''}.`}));
  if(r.rec>0&&r.saldo<0)A.push({n:'crit',t:'Mês fecha no vermelho',p:`Despesas e aportes de ${mesNome(m)} (pessoal + Athos) superam as receitas em ${brl(-r.saldo)}.`});
  else if(r.rec>0&&r.saldo<C.saldo_minimo)A.push({n:'warn',t:'Sobra abaixo do mínimo definido',p:`A sobra prevista é ${brl(r.saldo)}, abaixo do mínimo de ${brl(C.saldo_minimo)}.`});
  S.categorias.filter(c=>c.tipo==='despesa'&&+c.orcamento>0).forEach(c=>{
    const g=r.porCat[c.id]||0,u=g/c.orcamento*100;
    if(u>100)A.push({n:'crit',t:`${catLabel(c)} estourou o orçamento`,p:`Gasto de ${brl(g)} contra ${brl(c.orcamento)} previstos (${pct(u)}).`});
    else if(u>=C.alerta_orcamento)A.push({n:'warn',t:`${catLabel(c)} perto do limite`,p:`${pct(u)} do orçamento usado. Restam ${brl(c.orcamento-g)} no mês.`});
  });
  S.cartoes.forEach(c=>{
    const f=faturaCartao(c.id,m),u=f/c.limite*100,v=vencFatura(c,m);
    if(u>=C.alerta_cartao)A.push({n:'warn',t:`Cartão ${c.nome} com ${pct(u)} do limite`,p:`Fatura de ${mesNome(m)} soma ${brl(f)} de ${brl(c.limite)}.`});
    const dias=Math.round((new Date(v+'T12:00')-new Date(hoje()+'T12:00'))/864e5);
    if(f>0&&dias>=0&&dias<=C.dias_vencimento)A.push({n:'warn',t:`Fatura ${c.nome} vence ${dias===0?'hoje':'em '+dias+' dia(s)'}`,p:`Valor de ${brl(f)} com vencimento em ${dataBR(v)}.`});
  });
  const fut=comprometidoFuturo(m,3),rm=mediaMeses(m,3,x=>x.rec)||r.rec;
  if(rm&&fut/3/rm*100>=C.limite_parcelas)A.push({n:'warn',t:'Parcelas comprometem a renda futura',p:`Nos próximos 3 meses já existem ${brl(fut)} em parcelas, cerca de ${pct(fut/3/rm*100)} da renda mensal.`});
  const res=S.metas.find(x=>/reserva/i.test(x.tipo)),dm=mediaMeses(m,3,x=>x.porEsc.pessoal.desp)||r.desp;
  if(res&&dm){const ac=acumMeta(res.id),ideal=dm*C.reserva_meses;
    if(ac<ideal)A.push({n:'info',t:'Reserva de emergência incompleta',p:`Você tem ${brl0(ac)}, cobre ${(ac/dm).toFixed(1).replace('.',',')} meses de despesas pessoais. O ideal definido é ${C.reserva_meses} meses (${brl0(ideal)}).`});}
  const ord={crit:0,warn:1,info:2,ok:3};return A.sort((a,b)=>ord[a.n]-ord[b.n]);
}
function conselhos(m){
  const r=resumo(m),C=S.config,out=[];
  const recM=mediaMeses(m,3,x=>x.rec)||r.rec,despM=mediaMeses(m,3,x=>x.desp)||r.desp,sobraM=recM-despM;
  const pE=r.rec?r.grupos.essencial/r.rec*100:0,pS=r.rec?r.grupos.estilo/r.rec*100:0,pF=r.rec?r.apo/r.rec*100:0;
  if(pE>55)out.push({n:'warn',t:'Gastos essenciais acima de 50% da renda',p:`Essenciais estão em ${pct(pE)}. Renegociar contas fixas (plano de saúde, internet, seguros) tem o maior efeito duradouro.`});
  if(pS>30)out.push({n:'warn',t:'Estilo de vida acima de 30%',p:`Restaurantes, lazer, compras e assinaturas somam ${pct(pS)} da renda. Um teto semanal para restaurantes ajuda a segurar sem cortar tudo.`});
  if(pF<20)out.push({n:'info',t:'Guardando menos de 20% da renda',p:`Este mês foram para metas ${brl(r.apo)} (${pct(pF)}). Para chegar a 20% faltariam ${brl(Math.max(0,r.rec*.2-r.apo))}.`});
  else out.push({n:'ok',t:'Boa taxa de poupança',p:`${pct(pF)} da renda foi direcionada a metas neste mês.`});
  const a=r.porEsc.athos;
  if(a.rec||a.desp){const res=a.rec-a.desp;
    out.push(res<0?{n:'warn',t:'Athos gastou mais do que faturou',p:`No mês, a Athos tem ${brl(a.desp)} de despesas e ${brl(a.rec)} de receitas. A diferença de ${brl(-res)} está saindo do orçamento pessoal.`}
      :{n:'info',t:`Athos: resultado de ${brl(res)} no mês`,p:`As despesas da Athos representam ${pct(r.desp?a.desp/r.desp*100:0)} de tudo que saiu no mês. Separar uma parte do resultado para impostos e capital de giro evita aperto no pessoal.`});}
  const resM=S.metas.find(x=>/reserva/i.test(x.tipo));
  if(resM&&acumMeta(resM.id)<mediaMeses(m,3,x=>x.porEsc.pessoal.desp)*C.reserva_meses)out.push({n:'info',t:'Priorize a reserva antes de metas de consumo',p:`Enquanto a reserva não cobre ${C.reserva_meses} meses, direcione a maior parte da sobra para ela, em aplicação de liquidez diária.`});
  const totNeed=S.metas.reduce((s,g)=>s+Math.max(0,g.alvo-acumMeta(g.id))/mesesAte(g.prazo),0);
  if(totNeed>sobraM&&sobraM>0)out.push({n:'warn',t:'Metas exigem mais do que a sobra média',p:`Para cumprir todos os prazos seria preciso guardar ${brl0(totNeed)} por mês, mas a sobra média é ${brl0(sobraM)}. Considere estender o prazo da meta de menor prioridade.`});
  const cats=S.categorias.filter(c=>c.tipo==='despesa').map(c=>({c,g:r.porCat[c.id]||0})).sort((a,b)=>b.g-a.g);
  if(cats[0]&&cats[0].g>0)out.push({n:'info',t:`Maior gasto do mês: ${catLabel(cats[0].c)}`,p:`${brl(cats[0].g)}, ${pct(r.desp?cats[0].g/r.desp*100:0)} das despesas. Reduzir 10% aqui libera ${brl(cats[0].g*.1)} por mês.`});
  const rec=S.lancamentos.filter(l=>l.tipo==='despesa'&&recorrente(l)&&ocorrencia(l,m)),recT=rec.reduce((s,l)=>s+valorEm(l,m),0);
  if(recT)out.push({n:'info',t:`Despesas fixas recorrentes: ${brl(recT)} por mês`,p:`São ${rec.length} compromissos que se repetem. Revisar uma vez por ano (planos, assinaturas, seguros) costuma trazer economia sem mudar a rotina.`});
  const neg=invAtivos().filter(i=>+i.atual<+i.aplicado);
  if(neg.length)out.push({n:'info',t:'Investimentos abaixo do valor aplicado',p:`${neg.map(i=>i.nome).join(', ')}. Avalie se ainda fazem sentido para o seu prazo antes de qualquer decisão.`});
  return out;
}

function calcBaixa(inv,v){

  return{saida,custo,res:(+v.recebido||0)-custo};

function sugestoesFixas(m){

    const ant=[1,2,3].map(i=>S.lancamentos.find(x=>x.tipo==='despesa'&&!x.conta_pagar_id&&x.import_nome&&chaveNome(x.import_nome)===k&&ymOf(x.data)===addM(m,-i))).filter(Boolean);

  return out;
}

  const refM=ref||(itens.length?itens.map(x=>x.data.slice(0,7)).sort().pop():'');
  return{tipo:'extrato',ref:refM,itens,saldoFinal};

// Regras do extrato Inter: tipo do lançamento (Pix, Compra no débito...) + nome
const RX_MERCADO=/RISSUL|SUPERMERC|FORRAGEIR|EMPORIO|FRIDOLINA|BANCADAFLORESTA|ATACAD|HORTI|PADARIA|ACOUGUE|MERCADO|BERTOJAEMUBARACK|VALBELLUNA|COMERCIODEEMBALAGENS|ZAFFARI|BOURBON/;
const RX_REST=/VALEQUANTOPESA|RESTAURANTE|NOCCIOLA|CAFE|BURGER|SUBWAY|IFOOD|^IFD|TKM|ALFARAH|FORNEARIA|TANGO|SABORES|FEILONG|FRANOI|PIZZ|LANCHE|GELATO|LAGHETTOPEDRASALTAS|DOCE|SORVET|CHURRAS/;
const RX_TRANSP=/POSTO|ABASTEC|^EGR|UBER|COMBUST|PEDAGIO|ESTACION|IPIRANGA|PETROBRAS|SHELL/;
const RX_SAUDE=/FARMACIA|PANVEL|RAIA|DROGA|CLINICA|LABORAT|HOSPITAL|ODONTO/;
const RX_EDU=/UNIASSELVI|EDUCACIONAL|ESCOLA|CURSO|FACULDADE/;
const RX_PET=/VETERIN|PETSHOP|PETCENTER|AGROPEC|COBASI|PETZ/;
const FIXOS_EXT=['Salário','Resgate de investimentos','Entre suas contas','Estornos e cashback','Aplicações','Cartão Inter (fatura)','Impostos (DAS)','Pró-labore e INSS'];
function regraExtrato(tipoB,nome,receita){
  const T=normNome(tipoB),n=normNome(nome);
  if(receita){
    if(/LAGHETTOHOTEIS/.test(n))return['Salário','pessoal'];
    if(/HELEN/.test(n))return['Da Helen','pessoal'];
    if(/^RESGATE|VENCIMENTORENDAFIXA/.test(T)||(/^ESTORNO/.test(T)&&/CDB|PORQ/.test(n)))return['Resgate de investimentos','pessoal'];
    if(/TRANSFERENCIARECEBIDA/.test(T)||/EDUARDOBR|EDUARDOROHDEN/.test(n))return['Entre suas contas','pessoal'];
    if(/^ESTORNO|DEVOLVIDO|CASHBACK/.test(T))return['Estornos e cashback','pessoal'];
    return['Outros recebimentos','pessoal'];
  }
  if(/SIMPLESNACIONAL/.test(T)||/SIMPLESNACIONAL|DASSIMPLES/.test(n))return['Impostos (DAS)','athos'];
  if(/DARFNUMERADO/.test(T))return['Pró-labore e INSS','athos'];
  if(/^ELLO/.test(n))return['Contabilidade','athos'];
  if(/SPCONDOMINIO|CONDOMINIO/.test(n))return['Condomínio','pessoal'];
  if(/^RGE|AESSUL|CPFL/.test(n)||/CPFL/.test(T))return['Energia (RGE)','pessoal'];
  if(/MUNICIPIODECANELA|PREFMUNCANELA|IPTU/.test(n))return['IPTU e taxas','pessoal'];
  if(/PAGAMENTOFATURACARTAO|FATURACARTAO|PAGAMENTOFATURA/.test(n)||/FATURA/.test(T))return['Cartão Inter (fatura)','pessoal'];
  if(/BANCOC6/.test(n))return['Parcela do carro (C6)','pessoal'];
  if(/LUIZACRED/.test(n))return['LuizaCred','pessoal'];
  if(/UNIMED/.test(n))return['Unimed','pessoal'];
  if(/DEBITOAUTOMATICO/.test(T))return['Débito automático','pessoal'];
  if(/^APLICACAO|DEBITORENDAFIXA/.test(T))return['Aplicações','pessoal'];
  if(/TRANSFERENCIAENVIADA/.test(T)||/EDUARDOBR/.test(n))return['Entre suas contas','pessoal'];
  if(/PIX/.test(T)&&/HELEN/.test(n))return['Para a Helen','pessoal'];
  if(RX_MERCADO.test(n))return['Mercado','pessoal'];
  if(RX_REST.test(n))return['Restaurantes','pessoal'];
  if(RX_TRANSP.test(n))return['Transporte','pessoal'];
  if(RX_SAUDE.test(n))return['Saúde','pessoal'];
  if(RX_EDU.test(n))return['Educação','pessoal'];
  if(RX_PET.test(n))return['Pets','pessoal'];
  if(/PIXENVIADO/.test(T))return['Pix para particulares','pessoal'];
  if(/COMPRANODEBITO/.test(T))return['Outras compras','pessoal'];
  return['Outros','pessoal'];
}
function classificaExtrato(tipoB,nome,tipo){
  const[cat,esc]=regraExtrato(tipoB,nome,tipo==='receita');
  const acha=(n,e)=>S.categorias.find(c=>c.nome===n&&c.tipo===tipo&&(c.escopo||'pessoal')===e);
  if(!FIXOS_EXT.includes(cat)){const ant=S.lancamentos.filter(l=>l.import_nome===normNome(nome)&&l.tipo===tipo&&!l.cartao_id).sort((a,b)=>b.data.localeCompare(a.data))[0];
    if(ant&&ant.categoria_id)return{categoria_id:ant.categoria_id,escopo:ant.escopo||'pessoal',aprendido:true,catNome:catOf(ant.categoria_id).nome}}
  const c=acha(cat,esc)||acha(cat,'pessoal');
  if(c)return{categoria_id:c.id,escopo:c.escopo||'pessoal',catNome:cat};
  return{...sugereCategoria(nome,'',tipo),catNome:cat};
}
function meioExtrato(T){T=normNome(T);return /PIX|CREDITOLIBERADO/.test(T)?'pix':/COMPRANODEBITO/.test(T)?'debito':/PAGAMENTO|SIMPLES|DARF|DEBITOAUTOMATICO|TITULO|CONVENIO|BOLETO/.test(T)?'boleto':'debito'}
function montaLinhasExtrato(arqs,contaId){
  const out=[];

    const tipo=it.valor<0?'despesa':'receita',raw=(it.desc||it.hist||'Movimento').trim();
    const cl=classificaExtrato(it.hist,raw,tipo);
    const base={data:it.data,desc:limpaNome(raw,false)||'Movimento',valor:Math.abs(it.valor),parcelas:1,tipo,cartao_id:null,conta_id:contaId,meio:meioExtrato(it.hist),ref:a.ref,arq:a.nome,raw,hist:it.hist,...cl};
    const b=catOf(cl.categoria_id).bloco;
    if(b==='guardado')return out.push({...base,sel:true,status:'inv',resgate:tipo==='receita',guardar:'',motivo:tipo==='receita'?'resgate (volta do Porquinho ou investimento)':'guardado no Porquinho ou investimento'});
    if(b==='entre')return out.push({...base,sel:true,status:'novo',motivo:'entre suas contas, não soma nos ganhos e gastos'});
    out.push({...base,sel:true,status:'novo'});
  }));
  return out;
}
// Marca o que já existe no sistema para não duplicar
function marcaDuplicados(linhas){
  const usados=new Set(),usadosCp=new Set();
  linhas.forEach(r=>{
    if(r.status!=='novo'&&r.status!=='inv')return;
    const parc=r.valor/r.parcelas;
    let achou=S.lancamentos.find(l=>!usados.has(l.id)&&l.tipo===r.tipo&&(r.cartao_id?l.cartao_id===r.cartao_id:(!l.cartao_id&&l.conta_id===r.conta_id))&&!recorrente(l)
      &&(+l.parcelas||1)===r.parcelas&&diasEntre(l.data,r.data)<=(r.cartao_id?1:3)&&Math.abs(l.valor/(+l.parcelas||1)-parc)<=0.05);
    if(achou){usados.add(achou.id);r.status='dup';r.sel=false;r.motivo='já lançado: '+achou.descricao;return}
    if(r.status==='inv')return;
    const rec=S.lancamentos.find(l=>l.tipo===r.tipo&&recorrente(l)&&(r.cartao_id?l.cartao_id===r.cartao_id:l.conta_id===r.conta_id)&&(()=>{const o=ocorrencia(l,ymOf(r.data));return o&&diasEntre(o.data,r.data)<=5&&Math.abs(+o.valor-r.valor)<=Math.max(0.05,r.valor*(r.tipo==='receita'?0.03:0.001))})());
    if(rec){r.status='dup';r.sel=false;r.motivo='já previsto: '+rec.descricao+' (recorrente)';return}
    const k=chaveNome(r.raw);
    const cand=r.tipo==='despesa'?S.contasPagar.filter(b=>b.ativo!==false).map(b=>{
      const porId=idMatch(k,b.identificador),porNome=normNome(b.nome).length>=4&&k.includes(normNome(b.nome));
      const ref=cpValorRef(b),porValor=!r.cartao_id&&(!r.catNome||r.catNome==='Outros')&&b.conta_id===r.conta_id&&ref&&Math.abs(ref-r.valor)<=Math.max(1,ref*0.02);
      if(!porId&&!porNome&&!porValor)return null;const c=cpCompetencia(b,r.data,usadosCp);if(!c)return null;
      if(porValor&&!porId&&!porNome&&diasEntre(cpVenc(b,c),r.data)>7)return null;return{b,c,peso:porId?0:porNome?1:2}}).filter(Boolean).sort((a,c)=>a.peso-c.peso)[0]:null;
    const cp=cand&&cand.b;if(cp){r.cpComp=cand.c;usadosCp.add(cp.id+cand.c)}
    if(cp){r.cp=cp.id;r.categoria_id=cp.categoria_id;r.escopo=cp.escopo;r.desc=cp.nome+(r.cpComp!==ymOf(r.data)?' ('+mesNome(r.cpComp)+')':'');r.motivo=cp.nome}
  });
  return linhas;
}

  if(t==='config'){const p0=ant.parametros||{},p1=dep.parametros||{};return Object.keys(p1).filter(k=>p0[k]!==p1[k]).map(k=>`${k}: ${p0[k]??'—'} → ${p1[k]}`).join('; ')}
  const ch=Object.keys(dep).filter(k=>!IGN_AUD.includes(k)&&JSON.stringify(ant[k])!==JSON.stringify(dep[k])).map(k=>`${CAMPO_NOME[k]||k}: ${fmtAud(k,ant[k])} → ${fmtAud(k,dep[k])}`);
  return rotuloAud(t,dep)+(ch.length?' · '+ch.join('; '):'');
}
function vHist(){
  const rows=S.auditoria.filter(a=>!hFilter||a.usuario===hFilter);
  return topBar('Histórico de alterações',`<button class="btn" data-act="atualizar">Atualizar</button>`)+
  `<section class="panel"><div class="filters"><select id="h_user" aria-label="Filtrar por usuário"><option value="">Todos os usuários</option>${S.users.map(u=>`<option value="${u.id}" ${hFilter===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select><span class="muted" style="align-self:center">${rows.length} registros mais recentes</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Item</th><th>Detalhe</th></tr></thead><tbody>
  ${rows.map(a=>{const ac=ACAO_NOME[a.acao]||a.acao;return `<tr><td class="mono" style="white-space:nowrap">${new Date(a.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td><b>${esc(a.usuario?userNome(a.usuario):'Sistema')}</b></td><td><span class="chip ${ac==='excluiu'?'neg':ac==='criou'?'pos':ac==='alterou'||ac==='baixa'?'warn':''}">${esc(ac)}</span></td><td>${esc(TAB_NOME[a.tabela]||a.tabela)}</td><td class="muted">${esc(detalheAud(a))}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Sem registros.</td></tr>'}
  </tbody></table></div><div class="muted" style="font-size:12px">Gravado direto pelo banco: nenhuma alteração passa sem registro e o histórico não pode ser editado nem apagado.</div></section>`;
}
function listaCfg(ent,cols,filt=()=>true){
  return `<div class="tbl-wrap"><table><tbody>${S[ent].filter(filt).map(o=>`<tr>${cols(o)}<td class="act"><button class="icon" data-act="edit" data-ent="${ent}" data-id="${o.id}">Editar</button>${ent!=='users'?`<button class="icon" data-act="del" data-ent="${ent}" data-id="${o.id}">Excluir</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
function vConfig(){
  const C=S.config,P=[['alerta_orcamento','Alertar quando a categoria passar de (%)'],['alerta_cartao','Alertar quando o cartão passar de (% do limite)'],['saldo_minimo','Sobra mínima desejada no mês (R$)'],['reserva_meses','Reserva de emergência ideal (meses de despesa)'],['dias_vencimento','Avisar vencimento de fatura com (dias)'],['limite_parcelas','Parcelas no cartão: alertar acima de (% da renda)']];
  const catCols=o=>`<td>${esc(o.nome)}</td><td><span class="chip ${o.tipo==='receita'?'pos':''}">${o.tipo}</span></td><td class="v">${o.orcamento?brl0(o.orcamento):''}</td>`;
  return topBar('Configurações')+
  `<div class="grid2">
  <section class="panel"><h2>Minha conta</h2><div><b>${esc(me.nome)}</b><div class="muted">${esc(me.email)}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="senha">Alterar minha senha</button><button class="btn" data-act="edit" data-ent="users" data-id="${me.id}">Editar meu nome</button></div>
    <h2 style="margin-top:8px">Usuários com acesso</h2><div class="tbl-wrap"><table><tbody>${S.users.map(u=>`<tr><td><b>${esc(u.nome)}</b><div class="muted">${esc(u.email)}</div></td><td class="act">${u.id===me.id?'<span class="chip acc">você</span>':''}</td></tr>`).join('')}</tbody></table></div>
    <div class="muted" style="font-size:12px">Para incluir outra pessoa, crie o usuário no Supabase (Authentication &gt; Users) e vincule ao casal com o mesmo modelo do arquivo supabase-2-usuarios.sql.</div></section>
  <section class="panel"><h2>Alertas e parâmetros</h2><div class="form">${P.map(([k,l])=>`<div class="field full"><label for="cfg_${k}">${l}</label><input id="cfg_${k}" type="number" value="${C[k]}"></div>`).join('')}</div><button class="btn pri" data-act="save-cfg">Salvar parâmetros</button></section></div>
  <div class="grid2">
  <section class="panel"><div class="panel-h"><h2>Contas</h2><button class="btn sm" data-act="new" data-ent="contas">Adicionar</button></div>${listaCfg('contas',o=>`<td>${esc(o.nome)} <span class="chip">${esc(o.tipo||'')}</span></td><td class="v">${o.saldo_data?brl(saldoAtual(o)):'<button class="btn sm" data-act="saldo" data-id="'+o.id+'">Informar saldo</button>'}</td>`)}
    <div class="panel-h"><h2>Cartões</h2><button class="btn sm" data-act="new" data-ent="cartoes">Adicionar</button></div>${listaCfg('cartoes',o=>`<td>${esc(o.nome)} <span class="muted mono">${brl0(o.limite)}</span></td>`)||''}</section>
  <section class="panel"><div class="panel-h"><h2>Categorias</h2><div style="display:flex;gap:6px"><button class="btn sm" data-act="new" data-ent="categorias" data-preset="pessoal">Pessoal</button><button class="btn sm" data-act="new" data-ent="categorias" data-preset="athos">Athos</button></div></div>
    <div class="lbl">Pessoal</div>${listaCfg('categorias',catCols,c=>(c.escopo||'pessoal')==='pessoal')}
    <div class="lbl">Athos</div>${listaCfg('categorias',catCols,c=>c.escopo==='athos')}</section></div>
  <section class="panel"><h2>Dados</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Baixar backup (JSON)</button><button class="btn" data-act="atualizar">Atualizar dados agora</button></div>
    <div class="muted" style="font-size:12px">Os dados ficam no Supabase. O backup em JSON é uma cópia extra para guardar onde quiser.</div></section>`;
}
/* ---------------- Render e eventos ---------------- */
function render(){
  if(!me){vLogin();return}
  const V={gg:vGG,ganhos:()=>vFluxo('receita'),gastos:()=>vFluxo('despesa'),guardado:vGuardado,painel:vPainel,lancamentos:vLanc,cartoes:vCartoes,metas:vMetas,investimentos:vInv,orcamento:vOrc,conselheiro:vConselheiro,athos:vAthos,contas:vContasPagar,caixa:vCaixa,importar:vImportar,historico:vHist,config:vConfig};
  document.getElementById('root').innerHTML=shell((V[view]||vPainel)());
  if(view==='lancamentos'){
    const up=()=>{document.getElementById('lancTable').innerHTML=lancRows(F)};
    ['cat','autor','meio'].forEach(k=>{const el=document.getElementById('fl_'+k);if(el)el.onchange=e=>{F[k]=e.target.value;up()}});
    document.getElementById('fl_escopo').onchange=e=>{F.escopo=e.target.value;render()};
    document.getElementById('fl_q').oninput=e=>{F.q=e.target.value;up()};
  }
  if(view==='athos'){const up=()=>{document.getElementById('athosTable').innerHTML=lancRows({...FA,escopo:'athos'},true)};
    document.getElementById('fa_tipo').onchange=e=>{FA.tipo=e.target.value;up()};document.getElementById('fa_q').oninput=e=>{FA.q=e.target.value;up()}}
  if(view==='importar'&&!S.semImport){
    const fi=document.getElementById('imp_file');if(fi)fi.onchange=async e=>{if(!e.target.files.length)return;toast('Lendo arquivos...');await carregarArquivos([...e.target.files]);render()};
    const dd=document.getElementById('imp_dest');if(dd)dd.onchange=e=>{IMP.destino=e.target.value;montaImport();render()};
    const ck=document.getElementById('imp_saldo');if(ck)ck.onchange=e=>{IMP.atualizaSaldo=e.target.checked;render()};
    const tb=document.getElementById('impTable');if(tb)tb.addEventListener('change',e=>{const el=e.target.closest('[data-imp]');if(!el)return;const r=IMP.linhas[+el.dataset.imp],k=el.dataset.k;
      if(k==='cp'){const b=S.contasPagar.find(x=>x.id===el.value);
        if(!b){r.cp=null;r.cpComp=null;r.manual=false;r.desc=limpaNome(r.raw,!!r.cartao_id);render();return}
        const usados=new Set(IMP.linhas.filter(x=>x!==r&&x.cp).map(x=>x.cp+x.cpComp));const c=cpCompetencia(b,r.data,usados)||ymOf(r.data);
        r.cp=b.id;r.cpComp=c;r.manual=true;r.categoria_id=b.categoria_id;r.escopo=b.escopo;r.desc=b.nome+(c!==ymOf(r.data)?' ('+mesNome(c)+')':'');render();return}
      if(k==='sel'){r.sel=el.checked;render()}else if(k==='escopo'){r.escopo=el.value;const c=S.categorias.find(c=>c.tipo===r.tipo&&(c.escopo||'pessoal')===r.escopo);r.categoria_id=c?c.id:null;render()}else r[k]=el.value});
  }
  if(view==='historico')document.getElementById('h_user').onchange=e=>{hFilter=e.target.value;render()};
}
function presetFor(ent,p){
  if(!p)return{};
  if(ent==='lancamentos'){
    if(p==='receita')return{tipo:'receita',forma:'conta:'+(S.contas[0]?.id||''),categoria_id:catId('Salário','receita')};
    if(p==='athos')return{tipo:'despesa',escopo:'athos'};
    if(p==='athos-receita')return{tipo:'receita',escopo:'athos',forma:'conta:'+((S.contas.find(c=>c.tipo==='Empresa')||S.contas[0])?.id||'')};
    if(p.startsWith('cartao:'))return{tipo:'despesa',forma:p,parcelas:1};
    if(p.startsWith('parcelado:'))return{tipo:'despesa',forma:'cartao:'+p.split(':')[1],parcelas:2};
  }
  if(ent==='categorias')return{escopo:p};
  if(ent==='aportes'&&p.startsWith('meta:'))return{meta_id:p.slice(5)};
  return{};
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='close-bg'){if(e.target===b)closeModal();return}
  e.preventDefault();
  if(a==='nav'){if(b.dataset.v!==view&&(b.dataset.v==='ganhos'||b.dataset.v==='gastos')){FX.cat='';FX.meio=''}view=b.dataset.v;if(view==='historico'){render();await carregarAuditoria()}render();window.scrollTo(0,0)}
  else if(a==='mes'){mes=addM(mes,+b.dataset.d);GG.aberto='';render()}
  else if(a==='gg-aba'){GG.aba=b.dataset.v;render()}
  else if(a==='gg-mes'){mes=b.dataset.m;GG.aberto='';render()}
  else if(a==='gg-item'){if(e.target.closest('.gg-det'))return;GG.aberto=GG.aberto===b.dataset.k?'':b.dataset.k;render()}
  else if(a==='visao'){visao=b.dataset.v;render()}
  else if(a==='navmais'){navMais=!(navMais||NAV_MAIS.some(([k])=>k===view));if(!navMais&&NAV_MAIS.some(([k])=>k===view))view='gg';try{localStorage.setItem('fc_navmais',navMais?'1':'0')}catch(x){}render()}
  else if(a==='ftipo'){F.tipo=b.dataset.v;render()}
  else if(a==='fxper'){FX.per=b.dataset.v;render()}
  else if(a==='fxmeio'){FX.meio=b.dataset.v;render()}
  else if(a==='fxcat'){FX.cat=b.dataset.v;render()}
  else if(a==='fxlimpa'){FX.cat='';FX.meio='';render()}
  else if(a==='lmais'){lancMais=!lancMais;render()}
  else if(a==='lclear'){F.cat='';F.meio='';F.autor='';render()}
  else if(a==='logout'){log('saiu','Sessão','Encerrou a sessão');await sb.auth.signOut();me=null;view='gg';if(rtCanal){sb.removeChannel(rtCanal);rtCanal=null}render()}
  else if(a==='new')openForm(b.dataset.ent,null,presetFor(b.dataset.ent,b.dataset.preset));
  else if(a==='edit')openForm(b.dataset.ent,b.dataset.id);
  else if(a==='baixa')openForm('baixa',b.dataset.id);
  else if(a==='saldo')openForm('saldo',b.dataset.id);
  else if(a==='virar-fixa'){const x=sugestoesFixas(mes)[+b.dataset.i];if(!x)return;const l=x.l;
    try{await dbInsert('contas_pagar',toDb('contas_pagar',{id:uid(),nome:l.descricao,escopo:l.escopo||'pessoal',categoria_id:l.categoria_id||null,conta_id:l.conta_id||null,dia_vencimento:+l.data.slice(8,10),valor_estimado:Math.round(x.med*100)/100,inicio:addM(mes,-(x.n-1)),ativo:true,obs:'Criada pela conferência do extrato',autor:me.id}));
      const nova=null;await recarregar();const b2=S.contasPagar.find(c=>c.nome===l.descricao&&!c.identificador);if(b2){try{await dbUpdate('contas_pagar',b2.id,{identificador:x.k})}catch(e){}}
      const hist=S.lancamentos.filter(y=>y.tipo==='despesa'&&!y.conta_pagar_id&&y.import_nome&&chaveNome(y.import_nome)===x.k&&ymOf(y.data)>=addM(mes,-(x.n-1))&&ymOf(y.data)<=mes);
      if(b2)for(const y of hist){try{await dbUpdate('lancamentos',y.id,{conta_pagar_id:b2.id,competencia:ym2d(ymOf(y.data))})}catch(e){}}
      await recarregar();render();toast(l.descricao+' agora é conta fixa')}catch(e){toast('Não foi possível criar: '+e.message)}}
  else if(a==='imp-cancelar'){IMP=null;render()}
  else if(a==='imp-confirmar')confirmarImport();
  else if(a==='pagar')openForm('pagar',b.dataset.id,{competencia:b.dataset.m||curYM()});
  else if(a==='cp-sugestoes'){
    const pj=(S.contas.find(c=>c.tipo==='Empresa')||S.contas[0]||{}).id||null,pf=(S.contas[0]||{}).id||null;
    const sug=[['DAS','athos','Impostos (DAS)',20,pj],['Energia elétrica','pessoal','Energia e água',10,pf],['Água','pessoal','Energia e água',15,pf],['Condomínio','pessoal','Moradia',10,pf],['Internet e telefone','pessoal','Assinaturas e internet',10,pf]];
    try{for(const[nome,escopo,cat,dia,conta]of sug)if(!S.contasPagar.some(x=>x.nome===nome))await dbInsert('contas_pagar',toDb('contas_pagar',{id:uid(),nome,escopo,categoria_id:catId(cat,'despesa',escopo)||null,conta_id:conta,dia_vencimento:dia,valor_estimado:0,inicio:curYM(),ativo:true,obs:'',autor:me.id}));
      await recarregar();render();toast('Contas incluídas. Ajuste os dias de vencimento em Editar.')}catch(x){toast('Não foi possível incluir: '+x.message)}}
  else if(a==='senha')openForm('senha',me.id);
  else if(a==='save')saveForm();
  else if(a==='close'){closeModal();if(assinarTempoReal.pendente){assinarTempoReal.pendente=false;await recarregar();render()}}
  else if(a==='del')askDelete(b.dataset.ent,b.dataset.id);
  else if(a==='confirm-del')doDelete(b.dataset.ent,b.dataset.id);
  else if(a==='encerrar'){const l=S.lancamentos.find(x=>x.id===b.dataset.id);if(l){const ate=curYM()<ymOf(l.data)?ymOf(l.data):curYM();
    try{await dbUpdate('lancamentos',l.id,{ate:ym2d(ate),editado_por:me.id,editado_em:new Date().toISOString()});await recarregar();render();toast('Recorrência encerrada em '+mesNome(ate))}catch(x){toast('Não foi possível encerrar: '+x.message)}}}
  else if(a==='sim')simular();
  else if(a==='atualizar'){await recarregar();if(view==='historico')await carregarAuditoria();render();toast('Dados atualizados')}
  else if(a==='save-cfg'){const novo={...S.config};Object.keys(novo).forEach(k=>{const el=document.getElementById('cfg_'+k);if(el)novo[k]=+el.value});
    const{error}=await sb.from('config').upsert({household_id:S.household,parametros:novo});if(error){toast('Não foi possível salvar: '+error.message);return}
    S.config=novo;toast('Parâmetros salvos');render()}
  else if(a==='export'){const d=JSON.parse(JSON.stringify(S));delete d.auditoria;const blob=new Blob([JSON.stringify({gerado_em:new Date().toISOString(),...d},null,1)],{type:'application/json'});
    const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='financas-backup-'+hoje()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='frm'){e.preventDefault();if(editCtx)saveForm()}});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&me&&document.getElementById('modal').hidden){await recarregar();render()}});
(async function boot(){
  if(!sb){vLogin();return}
  telaMsg('Carregando','Conectando ao Supabase...');
  const{data}=await sb.auth.getSession();
  if(data&&data.session)await iniciar(data.session);else vLogin();
})();
</script>
